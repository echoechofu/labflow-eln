[package]
name = "labflow"
default-run = "labflow"
version = "0.1.3"
description = "Local-first experiment manager"
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[lib]
name = "labflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
sha2 = "0.10"
calamine = "0.30"
tauri-plugin-dialog = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
rmcp = { version = "0.16", features = ["server", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
