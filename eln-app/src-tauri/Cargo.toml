[package]
name = "labflow"
version = "0.1.0"
description = "Local-first experiment manager"
edition = "2021"

[lib]
name = "labflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
calamine = "0.30"
